name: cloudnex_pdf_android
description: Enterprise Android PDF viewer, editor, digital signature, and sharing suite powered by Syncfusion.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Syncfusion PDF Viewer & Processing Suite
  syncfusion_flutter_pdfviewer: ^28.2.9
  syncfusion_flutter_pdf: ^28.2.9
  syncfusion_flutter_core: ^28.2.9

  # OCR & Optical Recognition Engine
  google_mlkit_text_recognition: ^0.14.0

  # Android Native Integration & Sharing
  path_provider: ^2.1.2
  share_plus: ^10.1.4
  open_filex: ^4.5.0
  file_picker: ^8.1.7

  # UI and Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
